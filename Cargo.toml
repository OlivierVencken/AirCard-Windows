[package]
name = "aircard"
version = "1.2.4"
edition = "2024"
description = "Native Windows AirCard client"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
miniz_oxide = "0.8"
plist = "1"
quick-xml = "0.42"
regex = "1"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
svgtypes = "0.16.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
winit = { version = "0.30", default-features = false }
